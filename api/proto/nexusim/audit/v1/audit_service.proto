syntax = "proto3";

package nexusim.audit.v1;

option go_package = "github.com/qsyy0921/IM/api/proto/nexusim/audit/v1;auditv1";

service AuditService {
  rpc AppendAuditRecord(AppendAuditRecordRequest) returns (AppendAuditRecordResponse);
  rpc QueryAuditRecords(QueryAuditRecordsRequest) returns (QueryAuditRecordsResponse);
  rpc CreateAuditExport(CreateAuditExportRequest) returns (CreateAuditExportResponse);
  rpc GetAuditExport(GetAuditExportRequest) returns (GetAuditExportResponse);
  rpc VerifyAuditProof(VerifyAuditProofRequest) returns (VerifyAuditProofResponse);
}

message AuthContext {
  string tenant_id = 1;
  string user_id = 2;
  string device_id = 3;
  string session_id = 4;
  string trace_id = 5;
  string request_id = 6;
}

message AuditRecord {
  string tenant_id = 1;
  string audit_id = 2;
  string audit_stream = 3;
  string source_service = 4;
  string source_event_id = 5;
  string record_type = 6;
  string actor_ref = 7;
  string subject_ref = 8;
  string resource_ref = 9;
  string action = 10;
  string outcome = 11;
  string reason_code = 12;
  string risk_level = 13;
  int64 occurred_at_unix_ms = 14;
  int64 ingested_at_unix_ms = 15;
  string attributes_json = 16;
  string canonical_json_hash = 17;
  string previous_record_hash = 18;
  string record_hash = 19;
  string idempotency_key = 20;
}

message AppendAuditRecordRequest {
  AuthContext auth_context = 1;
  string audit_stream = 2;
  string source_service = 3;
  string source_event_id = 4;
  string record_type = 5;
  string actor_ref = 6;
  string subject_ref = 7;
  string resource_ref = 8;
  string action = 9;
  string outcome = 10;
  string reason_code = 11;
  string risk_level = 12;
  int64 occurred_at_unix_ms = 13;
  string attributes_json = 14;
  string idempotency_key = 15;
  string correlation_id = 16;
  string causation_id = 17;
  string trace_id = 18;
}

message AppendAuditRecordResponse {
  AuditRecord record = 1;
}

message QueryAuditRecordsRequest {
  AuthContext auth_context = 1;
  string audit_stream = 2;
  string record_type = 3;
  string source_service = 4;
  string after_audit_id = 5;
  int32 limit = 6;
}

message QueryAuditRecordsResponse {
  repeated AuditRecord records = 1;
  string next_cursor = 2;
}

message AuditExportJob {
  string tenant_id = 1;
  string export_id = 2;
  string status = 3;
  string audit_stream = 4;
  string record_type = 5;
  string source_service = 6;
  string filter_hash = 7;
  string redaction_profile = 8;
  string requested_by_ref = 9;
  int64 requested_at_unix_ms = 10;
  string manifest_ref = 11;
  int64 record_count = 12;
  int64 completed_at_unix_ms = 13;
  int64 failed_at_unix_ms = 14;
  string public_error = 15;
  string idempotency_key = 16;
}

message CreateAuditExportRequest {
  AuthContext auth_context = 1;
  string audit_stream = 2;
  string record_type = 3;
  string source_service = 4;
  string filter_hash = 5;
  string redaction_profile = 6;
  string requested_by_ref = 7;
  string idempotency_key = 8;
  string correlation_id = 9;
  string causation_id = 10;
  string trace_id = 11;
}

message CreateAuditExportResponse {
  AuditExportJob export_job = 1;
}

message GetAuditExportRequest {
  AuthContext auth_context = 1;
  string export_id = 2;
}

message GetAuditExportResponse {
  AuditExportJob export_job = 1;
}

message VerifyAuditProofRequest {
  AuthContext auth_context = 1;
  string audit_id = 2;
}

message VerifyAuditProofResponse {
  string audit_id = 1;
  bool valid = 2;
  string failure_reason = 3;
  string record_hash = 4;
  string previous_record_hash = 5;
}
