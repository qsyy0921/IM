name: nexusim-client-builders

services:
  client-android-apk-builder:
    profiles:
      - client-builders
    build:
      context: ../docker
      dockerfile: client-android-builder.Dockerfile
    image: nexusim/client-android-builder:local
    working_dir: /workspace
    environment:
      NEXUSIM_CLIENT_ARTIFACT_DIR: /artifacts/android
      NEXUSIM_CLIENT_ARTIFACT_RUN_ID: docker-android-debug
    volumes:
      - ../..:/workspace
      - ${NEXUSIM_CLIENT_ARTIFACTS_DIR:-../../clients/artifacts}:/artifacts
    command:
      - bash
      - -lc
      - >
        npm --prefix clients ci &&
        npm --prefix clients run build:android-apk:collect -- --artifact-output-dir "$${NEXUSIM_CLIENT_ARTIFACT_DIR}" --run-id "$${NEXUSIM_CLIENT_ARTIFACT_RUN_ID}"
