syntax = "proto3";

package nexusim.gateway.v1;

import "nexusim/contacts/v1/contacts_service.proto";
import "nexusim/conversation/v1/conversation_service.proto";
import "nexusim/delivery/v1/delivery_service.proto";
import "nexusim/identity/v1/identity_service.proto";
import "nexusim/message/v1/message_service.proto";
import "nexusim/receipt/v1/receipt_service.proto";

option go_package = "github.com/qsyy0921/IM/api/proto/nexusim/gateway/v1;gatewayv1";

// GatewayService is the first-stage public client facade.
// It intentionally excludes service-internal RPCs such as ConversationService.GetSendContext.
service GatewayService {
  rpc RegisterUser(nexusim.identity.v1.RegisterUserRequest) returns (nexusim.identity.v1.RegisterUserResponse);
  rpc Login(nexusim.identity.v1.LoginRequest) returns (nexusim.identity.v1.LoginResponse);
  rpc RefreshGatewayToken(nexusim.identity.v1.RefreshGatewayTokenRequest) returns (nexusim.identity.v1.RefreshGatewayTokenResponse);
  rpc RequestVerificationChallenge(nexusim.identity.v1.RequestVerificationChallengeRequest) returns (nexusim.identity.v1.RequestVerificationChallengeResponse);
  rpc ConfirmVerificationChallenge(nexusim.identity.v1.ConfirmVerificationChallengeRequest) returns (nexusim.identity.v1.ConfirmVerificationChallengeResponse);
  rpc RequestPasswordReset(nexusim.identity.v1.RequestPasswordResetRequest) returns (nexusim.identity.v1.RequestPasswordResetResponse);
  rpc ConfirmPasswordReset(nexusim.identity.v1.ConfirmPasswordResetRequest) returns (nexusim.identity.v1.ConfirmPasswordResetResponse);
  rpc BeginMFAEnrollment(nexusim.identity.v1.BeginMFAEnrollmentRequest) returns (nexusim.identity.v1.BeginMFAEnrollmentResponse);
  rpc ConfirmMFAEnrollment(nexusim.identity.v1.ConfirmMFAEnrollmentRequest) returns (nexusim.identity.v1.ConfirmMFAEnrollmentResponse);
  rpc DisableMFAFactor(nexusim.identity.v1.DisableMFAFactorRequest) returns (nexusim.identity.v1.DisableMFAFactorResponse);
  rpc RegenerateMFARecoveryCodes(nexusim.identity.v1.RegenerateMFARecoveryCodesRequest) returns (nexusim.identity.v1.RegenerateMFARecoveryCodesResponse);
  rpc RevokeMFARecoveryCodes(nexusim.identity.v1.RevokeMFARecoveryCodesRequest) returns (nexusim.identity.v1.RevokeMFARecoveryCodesResponse);

  rpc CreateMemberChange(nexusim.conversation.v1.CreateMemberChangeRequest) returns (nexusim.conversation.v1.CreateMemberChangeResponse);
  rpc GetMemberChange(nexusim.conversation.v1.GetMemberChangeRequest) returns (nexusim.conversation.v1.GetMemberChangeResponse);
  rpc ListConversationMembers(nexusim.conversation.v1.ListConversationMembersRequest) returns (nexusim.conversation.v1.ListConversationMembersResponse);
  rpc TransferConversationOwner(nexusim.conversation.v1.TransferConversationOwnerRequest) returns (nexusim.conversation.v1.TransferConversationOwnerResponse);

  rpc SendMessage(nexusim.message.v1.SendMessageRequest) returns (nexusim.message.v1.SendMessageResponse);
  rpc EditMessage(nexusim.message.v1.EditMessageRequest) returns (nexusim.message.v1.MessageChangeResponse);
  rpc RevokeMessage(nexusim.message.v1.RevokeMessageRequest) returns (nexusim.message.v1.MessageChangeResponse);
  rpc DeleteMessage(nexusim.message.v1.DeleteMessageRequest) returns (nexusim.message.v1.MessageChangeResponse);

  rpc PullInbox(nexusim.delivery.v1.PullInboxRequest) returns (nexusim.delivery.v1.PullInboxResponse);
  rpc AckDelivery(nexusim.delivery.v1.AckDeliveryRequest) returns (nexusim.delivery.v1.AckDeliveryResponse);
  rpc HideInboxItem(nexusim.delivery.v1.HideInboxItemRequest) returns (nexusim.delivery.v1.HideInboxItemResponse);

  rpc MarkRead(nexusim.receipt.v1.MarkReadRequest) returns (nexusim.receipt.v1.MarkReadResponse);
  rpc GetReceiptState(nexusim.receipt.v1.GetReceiptStateRequest) returns (nexusim.receipt.v1.GetReceiptStateResponse);
  rpc ListReceiptStates(nexusim.receipt.v1.ListReceiptStatesRequest) returns (nexusim.receipt.v1.ListReceiptStatesResponse);
  rpc ListConversations(nexusim.receipt.v1.ListConversationsRequest) returns (nexusim.receipt.v1.ListConversationsResponse);
  rpc ArchiveConversation(nexusim.receipt.v1.ArchiveConversationRequest) returns (nexusim.receipt.v1.ArchiveConversationResponse);
  rpc PinConversation(nexusim.receipt.v1.PinConversationRequest) returns (nexusim.receipt.v1.PinConversationResponse);
  rpc MuteConversation(nexusim.receipt.v1.MuteConversationRequest) returns (nexusim.receipt.v1.MuteConversationResponse);

  rpc SendContactRequest(nexusim.contacts.v1.SendContactRequestRequest) returns (nexusim.contacts.v1.SendContactRequestResponse);
  rpc RespondContactRequest(nexusim.contacts.v1.RespondContactRequestRequest) returns (nexusim.contacts.v1.RespondContactRequestResponse);
  rpc CancelContactRequest(nexusim.contacts.v1.CancelContactRequestRequest) returns (nexusim.contacts.v1.CancelContactRequestResponse);
  rpc ListContactRequests(nexusim.contacts.v1.ListContactRequestsRequest) returns (nexusim.contacts.v1.ListContactRequestsResponse);
  rpc ListContacts(nexusim.contacts.v1.ListContactsRequest) returns (nexusim.contacts.v1.ListContactsResponse);
  rpc GetContactState(nexusim.contacts.v1.GetContactStateRequest) returns (nexusim.contacts.v1.GetContactStateResponse);
  rpc DeleteContact(nexusim.contacts.v1.DeleteContactRequest) returns (nexusim.contacts.v1.DeleteContactResponse);
  rpc BlockContact(nexusim.contacts.v1.BlockContactRequest) returns (nexusim.contacts.v1.BlockContactResponse);
  rpc UnblockContact(nexusim.contacts.v1.UnblockContactRequest) returns (nexusim.contacts.v1.UnblockContactResponse);
  rpc UpdateContactRemark(nexusim.contacts.v1.UpdateContactRemarkRequest) returns (nexusim.contacts.v1.UpdateContactRemarkResponse);
}
