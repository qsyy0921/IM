name: nexusim-services

services:
  message-service-outbox-relay:
    image: nexusim/message-service:local
    container_name: nexusim-message-service-outbox-relay
    environment:
      NEXUSIM_MESSAGE_SERVICE_MODE: outbox-relay
      NEXUSIM_PG_DSN: postgres://nexusim:nexusim@postgres:5432/nexusim?sslmode=disable
      NEXUSIM_PG_MAX_CONNS: ${NEXUSIM_MESSAGE_OUTBOX_PG_MAX_CONNS:-8}
      NEXUSIM_KAFKA_BROKERS: kafka:29092
      NEXUSIM_OUTBOX_WORKERS: 4
      NEXUSIM_OUTBOX_BATCH_SIZE: 500
      NEXUSIM_OUTBOX_PUBLISH_BATCH_ENABLED: "true"
      NEXUSIM_OUTBOX_POLL_INTERVAL: 100ms
      NEXUSIM_OUTBOX_FAILURE_BACKOFF: 100ms
    restart: unless-stopped
    networks:
      - nexusim-services

  delivery-service-timeline-consumer:
    image: nexusim/delivery-service:local
    container_name: nexusim-delivery-service-timeline-consumer
    environment:
      NEXUSIM_DELIVERY_SERVICE_MODE: timeline-consumer
      NEXUSIM_PG_DSN: postgres://nexusim:nexusim@postgres:5432/nexusim?sslmode=disable
      NEXUSIM_DELIVERY_PG_MAX_CONNS: ${NEXUSIM_DELIVERY_TIMELINE_PG_MAX_CONNS:-16}
      NEXUSIM_KAFKA_BROKERS: kafka:29092
      NEXUSIM_DELIVERY_CONSUMER_GROUP: nexusim-delivery-service-local
      NEXUSIM_DELIVERY_TIMELINE_CONSUMER_WORKERS: 4
    restart: unless-stopped
    networks:
      - nexusim-services

  delivery-service-outbox-relay:
    image: nexusim/delivery-service:local
    container_name: nexusim-delivery-service-outbox-relay
    environment:
      NEXUSIM_DELIVERY_SERVICE_MODE: outbox-relay
      NEXUSIM_PG_DSN: postgres://nexusim:nexusim@postgres:5432/nexusim?sslmode=disable
      NEXUSIM_DELIVERY_PG_MAX_CONNS: ${NEXUSIM_DELIVERY_OUTBOX_PG_MAX_CONNS:-16}
      NEXUSIM_KAFKA_BROKERS: kafka:29092
      NEXUSIM_DELIVERY_OUTBOX_WORKERS: 8
      NEXUSIM_DELIVERY_OUTBOX_BATCH_SIZE: 500
      NEXUSIM_DELIVERY_KAFKA_BATCH_SIZE: 500
      NEXUSIM_DELIVERY_KAFKA_BATCH_TIMEOUT: 20ms
    restart: unless-stopped
    networks:
      - nexusim-services

  push-gateway-delivery-consumer:
    image: nexusim/push-gateway:local
    container_name: nexusim-push-gateway-delivery-consumer
    depends_on:
      push-gateway-ws:
        condition: service_started
    environment:
      NEXUSIM_PUSH_GATEWAY_MODE: delivery-consumer
      NEXUSIM_PUSH_ROUTE_BACKEND: redis
      NEXUSIM_PUSH_REDIS_MODE: single
      NEXUSIM_PUSH_REDIS_ADDR: redis:6379
      NEXUSIM_PUSH_CONVERSATION_ROUTE_CACHE_TTL: ${NEXUSIM_PUSH_CONVERSATION_ROUTE_CACHE_TTL:-250ms}
      NEXUSIM_PUSH_CONVERSATION_SIGNAL_SAMPLE_EVERY: ${NEXUSIM_PUSH_CONVERSATION_SIGNAL_SAMPLE_EVERY:-1}
      NEXUSIM_PUSH_CONVERSATION_SIGNAL_SAMPLE_EVERY_WRITE_FANOUT: ${NEXUSIM_PUSH_CONVERSATION_SIGNAL_SAMPLE_EVERY_WRITE_FANOUT:-}
      NEXUSIM_PUSH_CONVERSATION_SIGNAL_SAMPLE_EVERY_HYBRID_FANOUT: ${NEXUSIM_PUSH_CONVERSATION_SIGNAL_SAMPLE_EVERY_HYBRID_FANOUT:-}
      NEXUSIM_PUSH_CONVERSATION_SIGNAL_SAMPLE_EVERY_READ_FANOUT: ${NEXUSIM_PUSH_CONVERSATION_SIGNAL_SAMPLE_EVERY_READ_FANOUT:-10}
      NEXUSIM_PUSH_CONVERSATION_SIGNAL_SAMPLE_EVERY_BROADCAST_SIGNAL: ${NEXUSIM_PUSH_CONVERSATION_SIGNAL_SAMPLE_EVERY_BROADCAST_SIGNAL:-10}
      NEXUSIM_PUSH_CONVERSATION_SIGNAL_SUBSCRIBER_POLICY_WRITE_FANOUT: ${NEXUSIM_PUSH_CONVERSATION_SIGNAL_SUBSCRIBER_POLICY_WRITE_FANOUT:-}
      NEXUSIM_PUSH_CONVERSATION_SIGNAL_SUBSCRIBER_POLICY_HYBRID_FANOUT: ${NEXUSIM_PUSH_CONVERSATION_SIGNAL_SUBSCRIBER_POLICY_HYBRID_FANOUT:-}
      NEXUSIM_PUSH_CONVERSATION_SIGNAL_SUBSCRIBER_POLICY_READ_FANOUT: ${NEXUSIM_PUSH_CONVERSATION_SIGNAL_SUBSCRIBER_POLICY_READ_FANOUT:-100:20}
      NEXUSIM_PUSH_CONVERSATION_SIGNAL_SUBSCRIBER_POLICY_BROADCAST_SIGNAL: ${NEXUSIM_PUSH_CONVERSATION_SIGNAL_SUBSCRIBER_POLICY_BROADCAST_SIGNAL:-100:20}
      NEXUSIM_PUSH_CONVERSATION_SIGNAL_TOTAL_SUBSCRIBER_POLICY_WRITE_FANOUT: ${NEXUSIM_PUSH_CONVERSATION_SIGNAL_TOTAL_SUBSCRIBER_POLICY_WRITE_FANOUT:-}
      NEXUSIM_PUSH_CONVERSATION_SIGNAL_TOTAL_SUBSCRIBER_POLICY_HYBRID_FANOUT: ${NEXUSIM_PUSH_CONVERSATION_SIGNAL_TOTAL_SUBSCRIBER_POLICY_HYBRID_FANOUT:-}
      NEXUSIM_PUSH_CONVERSATION_SIGNAL_TOTAL_SUBSCRIBER_POLICY_READ_FANOUT: ${NEXUSIM_PUSH_CONVERSATION_SIGNAL_TOTAL_SUBSCRIBER_POLICY_READ_FANOUT:-400:50}
      NEXUSIM_PUSH_CONVERSATION_SIGNAL_TOTAL_SUBSCRIBER_POLICY_BROADCAST_SIGNAL: ${NEXUSIM_PUSH_CONVERSATION_SIGNAL_TOTAL_SUBSCRIBER_POLICY_BROADCAST_SIGNAL:-400:50}
      NEXUSIM_PUSH_DEBUG_ADDR: 172.30.80.44:11913
      NEXUSIM_DELIVERY_GRPC_ADDR: delivery-service-grpc:10497
      NEXUSIM_KAFKA_BROKERS: kafka:29092
      NEXUSIM_PUSH_GATEWAY_ID: nexusim-push-gateway-delivery-consumer
      NEXUSIM_PUSH_CONSUMER_GROUP: nexusim-push-gateway-local
    ports:
      - "11944:11913"
    restart: unless-stopped
    networks:
      nexusim-services:
        ipv4_address: 172.30.80.44

  push-gateway-identity-consumer:
    image: nexusim/push-gateway:local
    container_name: nexusim-push-gateway-identity-consumer
    depends_on:
      push-gateway-ws:
        condition: service_started
    environment:
      NEXUSIM_PUSH_GATEWAY_MODE: identity-consumer
      NEXUSIM_PUSH_ROUTE_BACKEND: redis
      NEXUSIM_PUSH_REDIS_MODE: single
      NEXUSIM_PUSH_REDIS_ADDR: redis:6379
      NEXUSIM_DELIVERY_GRPC_ADDR: delivery-service-grpc:10497
      NEXUSIM_KAFKA_BROKERS: kafka:29092
      NEXUSIM_PUSH_GATEWAY_ID: nexusim-push-gateway-identity-consumer
      NEXUSIM_PUSH_IDENTITY_CONSUMER_GROUP: nexusim-push-gateway-identity-local
    restart: unless-stopped
    networks:
      - nexusim-services

  receipt-service-delivery-consumer:
    image: nexusim/receipt-service:local
    container_name: nexusim-receipt-service-delivery-consumer
    environment:
      NEXUSIM_RECEIPT_SERVICE_MODE: delivery-consumer
      NEXUSIM_PG_DSN: postgres://nexusim:nexusim@postgres:5432/nexusim?sslmode=disable
      NEXUSIM_KAFKA_BROKERS: kafka:29092
      NEXUSIM_RECEIPT_CONSUMER_GROUP: nexusim-receipt-service-local
    restart: unless-stopped
    networks:
      - nexusim-services

  receipt-service-outbox-relay:
    image: nexusim/receipt-service:local
    container_name: nexusim-receipt-service-outbox-relay
    environment:
      NEXUSIM_RECEIPT_SERVICE_MODE: outbox-relay
      NEXUSIM_PG_DSN: postgres://nexusim:nexusim@postgres:5432/nexusim?sslmode=disable
      NEXUSIM_KAFKA_BROKERS: kafka:29092
    restart: unless-stopped
    networks:
      - nexusim-services

  contacts-service-outbox-relay:
    image: nexusim/contacts-service:local
    container_name: nexusim-contacts-service-outbox-relay
    environment:
      NEXUSIM_CONTACTS_SERVICE_MODE: outbox-relay
      NEXUSIM_PG_DSN: postgres://nexusim:nexusim@postgres:5432/nexusim?sslmode=disable
      NEXUSIM_KAFKA_BROKERS: kafka:29092
    restart: unless-stopped
    networks:
      - nexusim-services

  identity-service-outbox-relay:
    image: nexusim/identity-service:local
    container_name: nexusim-identity-service-outbox-relay
    environment:
      NEXUSIM_IDENTITY_SERVICE_MODE: outbox-relay
      NEXUSIM_PG_DSN: postgres://nexusim:nexusim@postgres:5432/nexusim?sslmode=disable
      NEXUSIM_KAFKA_BROKERS: kafka:29092
    restart: unless-stopped
    networks:
      - nexusim-services

  media-service-outbox-relay:
    image: nexusim/media-service:local
    container_name: nexusim-media-service-outbox-relay
    environment:
      NEXUSIM_MEDIA_SERVICE_MODE: outbox-relay
      NEXUSIM_PG_DSN: postgres://nexusim:nexusim@postgres:5432/nexusim?sslmode=disable
      NEXUSIM_KAFKA_BROKERS: kafka:29092
    restart: unless-stopped
    networks:
      - nexusim-services

  notification-service-outbox-relay:
    image: nexusim/notification-service:local
    container_name: nexusim-notification-service-outbox-relay
    environment:
      NEXUSIM_NOTIFICATION_SERVICE_MODE: outbox-relay
      NEXUSIM_PG_DSN: postgres://nexusim:nexusim@postgres:5432/nexusim?sslmode=disable
      NEXUSIM_KAFKA_BROKERS: kafka:29092
    restart: unless-stopped
    networks:
      - nexusim-services

  notification-service-delivery-worker:
    image: nexusim/notification-service:local
    container_name: nexusim-notification-service-delivery-worker
    environment:
      NEXUSIM_NOTIFICATION_SERVICE_MODE: delivery-worker
      NEXUSIM_PG_DSN: postgres://nexusim:nexusim@postgres:5432/nexusim?sslmode=disable
      NEXUSIM_NOTIFICATION_PROVIDER_MODE: noop
      NEXUSIM_NOTIFICATION_PROVIDER_ID: local-noop
    restart: unless-stopped
    networks:
      - nexusim-services

  admin-service-outbox-relay:
    image: nexusim/admin-service:local
    container_name: nexusim-admin-service-outbox-relay
    environment:
      NEXUSIM_ADMIN_SERVICE_MODE: outbox-relay
      NEXUSIM_PG_DSN: postgres://nexusim:nexusim@postgres:5432/nexusim?sslmode=disable
      NEXUSIM_KAFKA_BROKERS: kafka:29092
    restart: unless-stopped
    networks:
      - nexusim-services

  admin-service-operation-worker:
    image: nexusim/admin-service:local
    container_name: nexusim-admin-service-operation-worker
    environment:
      NEXUSIM_ADMIN_SERVICE_MODE: operation-worker
      NEXUSIM_PG_DSN: postgres://nexusim:nexusim@postgres:5432/nexusim?sslmode=disable
      NEXUSIM_ADMIN_OPERATION_EXECUTOR_ID: local-noop
    restart: unless-stopped
    networks:
      - nexusim-services

  workflow-service-compensation-worker:
    image: nexusim/workflow-service:local
    container_name: nexusim-workflow-service-compensation-worker
    environment:
      NEXUSIM_WORKFLOW_SERVICE_MODE: compensation-worker
      NEXUSIM_PG_DSN: postgres://nexusim:nexusim@postgres:5432/nexusim?sslmode=disable
      NEXUSIM_WORKFLOW_COMPENSATION_BATCH_SIZE: 50
      NEXUSIM_WORKFLOW_COMPENSATION_POLL_INTERVAL: 1s
    restart: unless-stopped
    networks:
      - nexusim-services

  workflow-service-timer-worker:
    image: nexusim/workflow-service:local
    container_name: nexusim-workflow-service-timer-worker
    environment:
      NEXUSIM_WORKFLOW_SERVICE_MODE: timer-worker
      NEXUSIM_PG_DSN: postgres://nexusim:nexusim@postgres:5432/nexusim?sslmode=disable
      NEXUSIM_WORKFLOW_TIMER_BATCH_SIZE: 50
      NEXUSIM_WORKFLOW_TIMER_POLL_INTERVAL: 1s
      NEXUSIM_WORKFLOW_TIMER_ERROR_BACKOFF: 1s
    restart: unless-stopped
    networks:
      - nexusim-services

  workflow-service-outbox-relay:
    image: nexusim/workflow-service:local
    container_name: nexusim-workflow-service-outbox-relay
    environment:
      NEXUSIM_WORKFLOW_SERVICE_MODE: outbox-relay
      NEXUSIM_PG_DSN: postgres://nexusim:nexusim@postgres:5432/nexusim?sslmode=disable
      NEXUSIM_KAFKA_BROKERS: kafka:29092
      NEXUSIM_WORKFLOW_EVENTS_TOPIC: im.workflow.events
    restart: unless-stopped
    networks:
      - nexusim-services

  search-service-timeline-consumer:
    image: nexusim/search-service:local
    container_name: nexusim-search-service-timeline-consumer
    environment:
      NEXUSIM_SEARCH_SERVICE_MODE: timeline-consumer
      NEXUSIM_PG_DSN: postgres://nexusim:nexusim@postgres:5432/nexusim?sslmode=disable
      NEXUSIM_KAFKA_BROKERS: kafka:29092
      NEXUSIM_SEARCH_CONSUMER_GROUP: nexusim-search-service-local
    restart: unless-stopped
    networks:
      - nexusim-services

  memory-service-timeline-consumer:
    image: nexusim/memory-service:local
    container_name: nexusim-memory-service-timeline-consumer
    environment:
      NEXUSIM_MEMORY_SERVICE_MODE: timeline-consumer
      NEXUSIM_PG_DSN: postgres://nexusim:nexusim@postgres:5432/nexusim?sslmode=disable
      NEXUSIM_KAFKA_BROKERS: kafka:29092
      NEXUSIM_MEMORY_CONSUMER_GROUP: nexusim-memory-service-local
    restart: unless-stopped
    networks:
      - nexusim-services

  vector-index-service-outbox-relay:
    image: nexusim/vector-index-service:local
    container_name: nexusim-vector-index-service-outbox-relay
    environment:
      NEXUSIM_VECTOR_INDEX_SERVICE_MODE: outbox-relay
      NEXUSIM_PG_DSN: postgres://nexusim:nexusim@postgres:5432/nexusim?sslmode=disable
      NEXUSIM_KAFKA_BROKERS: kafka:29092
    restart: unless-stopped
    networks:
      - nexusim-services

  vector-index-service-rebuild-worker:
    image: nexusim/vector-index-service:local
    container_name: nexusim-vector-index-service-rebuild-worker
    environment:
      NEXUSIM_VECTOR_INDEX_SERVICE_MODE: rebuild-worker
      NEXUSIM_PG_DSN: postgres://nexusim:nexusim@postgres:5432/nexusim?sslmode=disable
      NEXUSIM_VECTOR_REBUILD_BATCH_SIZE: 50
      NEXUSIM_VECTOR_REBUILD_POLL_INTERVAL: 1s
    restart: unless-stopped
    networks:
      - nexusim-services

  agent-service-approval-outbox-relay:
    image: nexusim/agent-service:local
    container_name: nexusim-agent-service-approval-outbox-relay
    environment:
      NEXUSIM_AGENT_SERVICE_MODE: approval-outbox-relay
      NEXUSIM_PG_DSN: postgres://nexusim:nexusim@postgres:5432/nexusim?sslmode=disable
      NEXUSIM_KAFKA_BROKERS: kafka:29092
    restart: unless-stopped
    networks:
      - nexusim-services

networks:
  nexusim-services:
    external: true
    name: nexusim-services
