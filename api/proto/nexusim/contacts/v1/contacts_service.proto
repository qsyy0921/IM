syntax = "proto3";

package nexusim.contacts.v1;

option go_package = "github.com/qsyy0921/IM/api/proto/nexusim/contacts/v1;contactsv1";

service ContactsService {
  rpc SendContactRequest(SendContactRequestRequest) returns (SendContactRequestResponse);
  rpc RespondContactRequest(RespondContactRequestRequest) returns (RespondContactRequestResponse);
  rpc CancelContactRequest(CancelContactRequestRequest) returns (CancelContactRequestResponse);
  rpc ListContactRequests(ListContactRequestsRequest) returns (ListContactRequestsResponse);
  rpc ListContacts(ListContactsRequest) returns (ListContactsResponse);
  rpc GetContactState(GetContactStateRequest) returns (GetContactStateResponse);
  rpc DeleteContact(DeleteContactRequest) returns (DeleteContactResponse);
  rpc BlockContact(BlockContactRequest) returns (BlockContactResponse);
  rpc UnblockContact(UnblockContactRequest) returns (UnblockContactResponse);
  rpc UpdateContactRemark(UpdateContactRemarkRequest) returns (UpdateContactRemarkResponse);
  rpc UpdateContactGroup(UpdateContactGroupRequest) returns (UpdateContactGroupResponse);
  rpc GetContactPrivacy(GetContactPrivacyRequest) returns (GetContactPrivacyResponse);
  rpc SetContactPrivacy(SetContactPrivacyRequest) returns (SetContactPrivacyResponse);
}

message AuthContext {
  string tenant_id = 1;
  string user_id = 2;
  string device_id = 3;
  string session_id = 4;
  string trace_id = 5;
  string request_id = 6;
}

enum ContactRequestStatus {
  CONTACT_REQUEST_STATUS_UNSPECIFIED = 0;
  CONTACT_REQUEST_STATUS_PENDING = 1;
  CONTACT_REQUEST_STATUS_ACCEPTED = 2;
  CONTACT_REQUEST_STATUS_DECLINED = 3;
  CONTACT_REQUEST_STATUS_CANCELED = 4;
  CONTACT_REQUEST_STATUS_EXPIRED = 5;
}

enum ContactEdgeStatus {
  CONTACT_EDGE_STATUS_UNSPECIFIED = 0;
  CONTACT_EDGE_STATUS_ACTIVE = 1;
  CONTACT_EDGE_STATUS_DELETED = 2;
  CONTACT_EDGE_STATUS_BLOCKED = 3;
}

enum ContactDecision {
  CONTACT_DECISION_UNSPECIFIED = 0;
  CONTACT_DECISION_ACCEPT = 1;
  CONTACT_DECISION_DECLINE = 2;
}

enum ContactRequestListDirection {
  CONTACT_REQUEST_LIST_DIRECTION_UNSPECIFIED = 0;
  CONTACT_REQUEST_LIST_DIRECTION_INCOMING = 1;
  CONTACT_REQUEST_LIST_DIRECTION_OUTGOING = 2;
}

enum ContactRequestSourceType {
  CONTACT_REQUEST_SOURCE_TYPE_UNSPECIFIED = 0;
  CONTACT_REQUEST_SOURCE_TYPE_DIRECT = 1;
  CONTACT_REQUEST_SOURCE_TYPE_SEARCH = 2;
  CONTACT_REQUEST_SOURCE_TYPE_GROUP = 3;
  CONTACT_REQUEST_SOURCE_TYPE_INVITE_LINK = 4;
  CONTACT_REQUEST_SOURCE_TYPE_QR_CODE = 5;
  CONTACT_REQUEST_SOURCE_TYPE_IMPORT = 6;
}

enum ContactPrivacyPolicySource {
  CONTACT_PRIVACY_POLICY_SOURCE_UNSPECIFIED = 0;
  CONTACT_PRIVACY_POLICY_SOURCE_USER = 1;
  CONTACT_PRIVACY_POLICY_SOURCE_TENANT_DEFAULT = 2;
  CONTACT_PRIVACY_POLICY_SOURCE_SYSTEM_DEFAULT = 3;
}

message SendContactRequestRequest {
  AuthContext auth_context = 1;
  string target_user_id = 2;
  string idempotency_key = 3;
  string message = 4;
  ContactRequestSourceType source_type = 5;
  string source_ref = 6;
}

message SendContactRequestResponse {
  string request_id = 1;
  string tenant_id = 2;
  string sender_user_id = 3;
  string receiver_user_id = 4;
  ContactRequestStatus status = 5;
  bool idempotent_replay = 6;
  ContactRequestSourceType source_type = 7;
  string source_ref = 8;
}

message RespondContactRequestRequest {
  AuthContext auth_context = 1;
  string request_id = 2;
  ContactDecision decision = 3;
  string idempotency_key = 4;
}

message RespondContactRequestResponse {
  string request_id = 1;
  string tenant_id = 2;
  string sender_user_id = 3;
  string receiver_user_id = 4;
  ContactRequestStatus status = 5;
  bool idempotent_replay = 6;
}

message CancelContactRequestRequest {
  AuthContext auth_context = 1;
  string request_id = 2;
  string idempotency_key = 3;
}

message CancelContactRequestResponse {
  string request_id = 1;
  string tenant_id = 2;
  string sender_user_id = 3;
  string receiver_user_id = 4;
  ContactRequestStatus status = 5;
  bool idempotent_replay = 6;
}

message ListContactRequestsRequest {
  AuthContext auth_context = 1;
  ContactRequestListDirection direction = 2;
  ContactRequestStatus status = 3;
  int32 page_size = 4;
  string page_token = 5;
}

message ContactRequestItem {
  string request_id = 1;
  string sender_user_id = 2;
  string receiver_user_id = 3;
  ContactRequestStatus status = 4;
  string message = 5;
  int64 created_at_unix_ms = 6;
  int64 updated_at_unix_ms = 7;
  int64 decided_at_unix_ms = 8;
  ContactRequestSourceType source_type = 9;
  string source_ref = 10;
}

message ListContactRequestsResponse {
  string tenant_id = 1;
  string user_id = 2;
  ContactRequestListDirection direction = 3;
  ContactRequestStatus status = 4;
  repeated ContactRequestItem requests = 5;
  string next_page_token = 6;
}

message ListContactsRequest {
  AuthContext auth_context = 1;
  int32 page_size = 2;
  string page_token = 3;
  string query = 4;
  string group_name = 5;
}

message ContactItem {
  string contact_user_id = 1;
  ContactEdgeStatus status = 2;
  int64 version = 3;
  string source_request_id = 4;
  int64 created_at_unix_ms = 5;
  int64 updated_at_unix_ms = 6;
  string remark = 7;
  string group_name = 8;
}

message ListContactsResponse {
  string tenant_id = 1;
  string owner_user_id = 2;
  repeated ContactItem contacts = 3;
  string next_page_token = 4;
}

message GetContactStateRequest {
  AuthContext auth_context = 1;
  string other_user_id = 2;
}

message GetContactStateResponse {
  string tenant_id = 1;
  string owner_user_id = 2;
  string contact_user_id = 3;
  ContactEdgeStatus status = 4;
  string source_request_id = 5;
  int64 version = 6;
  string remark = 7;
  string group_name = 8;
}

message DeleteContactRequest {
  AuthContext auth_context = 1;
  string contact_user_id = 2;
  string idempotency_key = 3;
}

message DeleteContactResponse {
  string tenant_id = 1;
  string owner_user_id = 2;
  string contact_user_id = 3;
  ContactEdgeStatus status = 4;
  string source_request_id = 5;
  int64 version = 6;
  bool idempotent_replay = 7;
}

message BlockContactRequest {
  AuthContext auth_context = 1;
  string contact_user_id = 2;
  string idempotency_key = 3;
  string reason = 4;
}

message BlockContactResponse {
  string tenant_id = 1;
  string owner_user_id = 2;
  string contact_user_id = 3;
  ContactEdgeStatus status = 4;
  string source_request_id = 5;
  int64 version = 6;
  bool idempotent_replay = 7;
}

message UnblockContactRequest {
  AuthContext auth_context = 1;
  string contact_user_id = 2;
  string idempotency_key = 3;
}

message UnblockContactResponse {
  string tenant_id = 1;
  string owner_user_id = 2;
  string contact_user_id = 3;
  ContactEdgeStatus status = 4;
  string source_request_id = 5;
  int64 version = 6;
  bool idempotent_replay = 7;
}

message UpdateContactRemarkRequest {
  AuthContext auth_context = 1;
  string contact_user_id = 2;
  string remark = 3;
  string idempotency_key = 4;
}

message UpdateContactRemarkResponse {
  string tenant_id = 1;
  string owner_user_id = 2;
  string contact_user_id = 3;
  ContactEdgeStatus status = 4;
  string source_request_id = 5;
  int64 version = 6;
  string remark = 7;
  bool idempotent_replay = 8;
}

message UpdateContactGroupRequest {
  AuthContext auth_context = 1;
  string contact_user_id = 2;
  string group_name = 3;
  string idempotency_key = 4;
}

message UpdateContactGroupResponse {
  string tenant_id = 1;
  string owner_user_id = 2;
  string contact_user_id = 3;
  ContactEdgeStatus status = 4;
  string source_request_id = 5;
  int64 version = 6;
  string group_name = 7;
  bool idempotent_replay = 8;
}

message ContactPrivacySettings {
  bool allow_contact_requests = 1;
  int64 version = 2;
  int64 updated_at_unix_ms = 3;
  ContactPrivacyPolicySource policy_source = 4;
  bool allow_search_contact_requests = 5;
}

message GetContactPrivacyRequest {
  AuthContext auth_context = 1;
}

message GetContactPrivacyResponse {
  string tenant_id = 1;
  string user_id = 2;
  ContactPrivacySettings settings = 3;
}

message SetContactPrivacyRequest {
  AuthContext auth_context = 1;
  bool allow_contact_requests = 2;
  string idempotency_key = 3;
  optional bool allow_search_contact_requests = 4;
}

message SetContactPrivacyResponse {
  string tenant_id = 1;
  string user_id = 2;
  ContactPrivacySettings settings = 3;
  bool idempotent_replay = 4;
}
