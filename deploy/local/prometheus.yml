global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - host.docker.internal:19093

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: nexusim-api-gateway
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:11904
        labels:
          service: api-gateway

  - job_name: nexusim-identity-service
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:11905
        labels:
          service: identity-service

  - job_name: nexusim-message-service
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:11910
        labels:
          service: message-service

  - job_name: nexusim-conversation-service
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:11911
        labels:
          service: conversation-service

  - job_name: nexusim-delivery-service
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:11912
        labels:
          service: delivery-service

  - job_name: nexusim-push-gateway
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:11913
        labels:
          service: push-gateway

  - job_name: nexusim-receipt-service
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:11914
        labels:
          service: receipt-service

  - job_name: nexusim-contacts-service
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:11915
        labels:
          service: contacts-service

  - job_name: nexusim-policy-service
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:11916
        labels:
          service: policy-service

  - job_name: nexusim-search-service
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:11917
        labels:
          service: search-service

  - job_name: nexusim-memory-service
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:11918
        labels:
          service: memory-service
