name: nexusim-prometheus

services:
  prometheus:
    image: ${NEXUSIM_PROMETHEUS_IMAGE:-prom/prometheus:v2.54.1}
    container_name: nexusim-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.listen-address=0.0.0.0:9090"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=24h"
    ports:
      - "19090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus-api-gateway-alerts.yml:/etc/prometheus/rules/api-gateway.yml:ro
      - ./prometheus-identity-service-alerts.yml:/etc/prometheus/rules/identity-service.yml:ro
      - ./prometheus-message-service-alerts.yml:/etc/prometheus/rules/message-service.yml:ro
      - ./prometheus-conversation-service-alerts.yml:/etc/prometheus/rules/conversation-service.yml:ro
      - ./prometheus-delivery-service-alerts.yml:/etc/prometheus/rules/delivery-service.yml:ro
      - ./prometheus-push-gateway-alerts.yml:/etc/prometheus/rules/push-gateway.yml:ro
      - ./prometheus-receipt-service-alerts.yml:/etc/prometheus/rules/receipt-service.yml:ro
      - ./prometheus-contacts-service-alerts.yml:/etc/prometheus/rules/contacts-service.yml:ro
      - ./prometheus-policy-service-alerts.yml:/etc/prometheus/rules/policy-service.yml:ro
