groups:
  - name: nexusim-api-gateway-first-stage
    rules:
      - alert: NexusIMApiGatewayGrpcErrors
        expr: increase(nexusim_api_gateway_grpc_errors_total[5m]) > 0
        for: 1m
        labels:
          severity: warning
          service: api-gateway
        annotations:
          summary: api-gateway returned gRPC errors
          description: api-gateway has non-OK gRPC responses in the last five minutes. Inspect /debug/metrics and service logs before treating this as a production SLO alert.

      - alert: NexusIMApiGatewayLegacyDescriptorTraffic
        expr: increase(nexusim_api_gateway_grpc_exposure_requests_total{exposure="legacy_descriptor"}[10m]) > 0
        for: 1m
        labels:
          severity: warning
          service: api-gateway
        annotations:
          summary: api-gateway legacy descriptor traffic observed
          description: legacy descriptor traffic is still present. Keep legacy descriptor removal blocked until this remains zero in the target environment.

      - alert: NexusIMApiGatewayLegacyDescriptorStillRegistered
        expr: nexusim_api_gateway_legacy_descriptors_registered == 1
        for: 1m
        labels:
          severity: warning
          service: api-gateway
        annotations:
          summary: api-gateway legacy descriptors are still registered
          description: api-gateway is still exposing legacy service descriptors. Keep this as explicit opt-in only and do not remove compatibility code until the migration gate passes.

      - alert: NexusIMApiGatewayLegacyDescriptorOptInExpired
        expr: nexusim_api_gateway_legacy_descriptors_allowed_until_unix_milliseconds > 0 and nexusim_api_gateway_legacy_descriptors_allowed_until_unix_milliseconds < (time() * 1000)
        for: 1m
        labels:
          severity: warning
          service: api-gateway
        annotations:
          summary: api-gateway legacy descriptor opt-in deadline expired
          description: api-gateway is past the configured legacy descriptor opt-in deadline. Disable NEXUSIM_API_GATEWAY_REGISTER_LEGACY_DESCRIPTORS or extend the deadline with an explicit migration decision.

      - alert: NexusIMApiGatewayRateLimitRedisErrors
        expr: increase(nexusim_api_gateway_rate_limit_redis_errors_total[5m]) > 0
        for: 1m
        labels:
          severity: warning
          service: api-gateway
        annotations:
          summary: api-gateway rate limiter saw Redis errors
          description: Redis-backed rate limiting has backend errors. Check whether fail-open is enabled and whether tenant quota enforcement is degraded.

      - alert: NexusIMApiGatewayRateLimitIdentityErrors
        expr: increase(nexusim_api_gateway_rate_limit_identity_errors_total[5m]) > 0
        for: 1m
        labels:
          severity: warning
          service: api-gateway
        annotations:
          summary: api-gateway rate limiter saw identity lookup errors
          description: Tenant-scoped rate limiting could not resolve identity data. Check identity-service connectivity before treating tenant quota enforcement as healthy.

      - alert: NexusIMApiGatewayTenantQuotaReloadErrors
        expr: increase(nexusim_api_gateway_rate_limit_tenant_plan_reload_errors_total[5m]) > 0
        for: 1m
        labels:
          severity: warning
          service: api-gateway
        annotations:
          summary: api-gateway tenant quota reload failed
          description: api-gateway failed to reload the tenant quota snapshot. Check the file or URL source, checksum policy and TLS / bearer-token configuration.

      - alert: NexusIMApiGatewayTenantQuotaSnapshotStale
        expr: nexusim_api_gateway_rate_limit_tenant_plan_stale == 1
        for: 1m
        labels:
          severity: warning
          service: api-gateway
        annotations:
          summary: api-gateway tenant quota snapshot is stale
          description: The applied tenant quota snapshot is older than its configured max age. Check the quota config source and reload errors before treating tenant limits as current.

      - alert: NexusIMApiGatewayJwksRefreshFailures
        expr: increase(nexusim_api_gateway_auth_jwks_refresh_failures_total[10m]) > 0
        for: 1m
        labels:
          severity: warning
          service: api-gateway
        annotations:
          summary: api-gateway JWKS refresh failed
          description: api-gateway could not refresh JWT verification keys. Existing cached keys may still work, but key rotation may be delayed.

      - alert: NexusIMApiGatewayOtlpEndpointMissing
        expr: nexusim_api_gateway_otel_traces_enabled{exporter="otlp-grpc"} == 1 and on(exporter) nexusim_api_gateway_otel_traces_otlp_endpoint_configured{exporter="otlp-grpc"} == 0
        for: 1m
        labels:
          severity: warning
          service: api-gateway
        annotations:
          summary: api-gateway OTLP traces enabled without endpoint
          description: api-gateway is configured for otlp-grpc tracing but has no OTLP endpoint configured.
