services:
  contacts-service-grpc:
    build:
      context: ../..
      dockerfile: deploy/docker/contacts-service.runtime.Dockerfile
    image: nexusim/contacts-service:local
    container_name: nexusim-contacts-service-grpc
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NEXUSIM_CONTACTS_SERVICE_MODE: grpc
      NEXUSIM_CONTACTS_AUTH_MODE: metadata
      NEXUSIM_CONTACTS_GRPC_ADDR: 0.0.0.0:10500
      NEXUSIM_CONTACTS_DEBUG_ADDR: 0.0.0.0:10501
      NEXUSIM_PG_DSN: postgres://nexusim:nexusim@postgres:5432/nexusim?sslmode=disable
      NEXUSIM_CONTACTS_PG_MAX_CONNS: 16
    ports:
      - "10500:10500"
      - "10501:10501"
    restart: unless-stopped

  contacts-service-outbox-relay:
    image: nexusim/contacts-service:local
    container_name: nexusim-contacts-service-outbox-relay
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
      contacts-service-grpc:
        condition: service_started
    environment:
      NEXUSIM_CONTACTS_SERVICE_MODE: outbox-relay
      NEXUSIM_CONTACTS_DEBUG_ADDR: 0.0.0.0:10502
      NEXUSIM_PG_DSN: postgres://nexusim:nexusim@postgres:5432/nexusim?sslmode=disable
      NEXUSIM_KAFKA_BROKERS: kafka:29092
      NEXUSIM_CONTACT_EVENTS_TOPIC: im.contact.events
      NEXUSIM_CONTACTS_OUTBOX_BATCH_SIZE: 500
      NEXUSIM_CONTACTS_OUTBOX_MAX_ATTEMPTS: 5
      NEXUSIM_CONTACTS_OUTBOX_RETRY_BASE_DELAY: 1s
    ports:
      - "10502:10502"
    restart: unless-stopped

  contacts-service-outbox-repair:
    image: nexusim/contacts-service:local
    profiles:
      - contacts-repair
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NEXUSIM_CONTACTS_SERVICE_MODE: outbox-repair
      NEXUSIM_PG_DSN: postgres://nexusim:nexusim@postgres:5432/nexusim?sslmode=disable
      NEXUSIM_CONTACTS_OUTBOX_REPAIR_EVENT_IDS: ${NEXUSIM_CONTACTS_OUTBOX_REPAIR_EVENT_IDS:-}
      NEXUSIM_CONTACTS_OUTBOX_REPAIR_REASON: ${NEXUSIM_CONTACTS_OUTBOX_REPAIR_REASON:-manual contacts outbox repair}
    restart: "no"
