name: nexusim-services

services:
  message-service-outbox-relay:
    image: nexusim/message-service:local
    container_name: nexusim-message-service-outbox-relay
    environment:
      NEXUSIM_MESSAGE_SERVICE_MODE: outbox-relay
      NEXUSIM_PG_DSN: postgres://nexusim:nexusim@host.docker.internal:5432/nexusim?sslmode=disable
      NEXUSIM_KAFKA_BROKERS: kafka:29092
    restart: unless-stopped
    networks:
      - nexusim-services
      - nexusim-local

  delivery-service-timeline-consumer:
    image: nexusim/delivery-service:local
    container_name: nexusim-delivery-service-timeline-consumer
    environment:
      NEXUSIM_DELIVERY_SERVICE_MODE: timeline-consumer
      NEXUSIM_PG_DSN: postgres://nexusim:nexusim@host.docker.internal:5432/nexusim?sslmode=disable
      NEXUSIM_KAFKA_BROKERS: kafka:29092
      NEXUSIM_DELIVERY_CONSUMER_GROUP: nexusim-delivery-service-local
    restart: unless-stopped
    networks:
      - nexusim-services
      - nexusim-local

  delivery-service-outbox-relay:
    image: nexusim/delivery-service:local
    container_name: nexusim-delivery-service-outbox-relay
    environment:
      NEXUSIM_DELIVERY_SERVICE_MODE: outbox-relay
      NEXUSIM_PG_DSN: postgres://nexusim:nexusim@host.docker.internal:5432/nexusim?sslmode=disable
      NEXUSIM_KAFKA_BROKERS: kafka:29092
    restart: unless-stopped
    networks:
      - nexusim-services
      - nexusim-local

  push-gateway-delivery-consumer:
    image: nexusim/push-gateway:local
    container_name: nexusim-push-gateway-delivery-consumer
    depends_on:
      push-gateway-ws:
        condition: service_started
    environment:
      NEXUSIM_PUSH_GATEWAY_MODE: delivery-consumer
      NEXUSIM_PUSH_ROUTE_BACKEND: redis
      NEXUSIM_PUSH_REDIS_MODE: single
      NEXUSIM_PUSH_REDIS_ADDR: host.docker.internal:6379
      NEXUSIM_DELIVERY_GRPC_ADDR: delivery-service-grpc:10497
      NEXUSIM_KAFKA_BROKERS: kafka:29092
      NEXUSIM_PUSH_GATEWAY_ID: nexusim-push-gateway-delivery-consumer
      NEXUSIM_PUSH_CONSUMER_GROUP: nexusim-push-gateway-local
    restart: unless-stopped
    networks:
      - nexusim-services
      - nexusim-local

  push-gateway-identity-consumer:
    image: nexusim/push-gateway:local
    container_name: nexusim-push-gateway-identity-consumer
    depends_on:
      push-gateway-ws:
        condition: service_started
    environment:
      NEXUSIM_PUSH_GATEWAY_MODE: identity-consumer
      NEXUSIM_PUSH_ROUTE_BACKEND: redis
      NEXUSIM_PUSH_REDIS_MODE: single
      NEXUSIM_PUSH_REDIS_ADDR: host.docker.internal:6379
      NEXUSIM_DELIVERY_GRPC_ADDR: delivery-service-grpc:10497
      NEXUSIM_KAFKA_BROKERS: kafka:29092
      NEXUSIM_PUSH_GATEWAY_ID: nexusim-push-gateway-identity-consumer
      NEXUSIM_PUSH_IDENTITY_CONSUMER_GROUP: nexusim-push-gateway-identity-local
    restart: unless-stopped
    networks:
      - nexusim-services
      - nexusim-local

  receipt-service-delivery-consumer:
    image: nexusim/receipt-service:local
    container_name: nexusim-receipt-service-delivery-consumer
    environment:
      NEXUSIM_RECEIPT_SERVICE_MODE: delivery-consumer
      NEXUSIM_PG_DSN: postgres://nexusim:nexusim@host.docker.internal:5432/nexusim?sslmode=disable
      NEXUSIM_KAFKA_BROKERS: kafka:29092
      NEXUSIM_RECEIPT_CONSUMER_GROUP: nexusim-receipt-service-local
    restart: unless-stopped
    networks:
      - nexusim-services
      - nexusim-local

  receipt-service-outbox-relay:
    image: nexusim/receipt-service:local
    container_name: nexusim-receipt-service-outbox-relay
    environment:
      NEXUSIM_RECEIPT_SERVICE_MODE: outbox-relay
      NEXUSIM_PG_DSN: postgres://nexusim:nexusim@host.docker.internal:5432/nexusim?sslmode=disable
      NEXUSIM_KAFKA_BROKERS: kafka:29092
    restart: unless-stopped
    networks:
      - nexusim-services
      - nexusim-local

  contacts-service-outbox-relay:
    image: nexusim/contacts-service:local
    container_name: nexusim-contacts-service-outbox-relay
    environment:
      NEXUSIM_CONTACTS_SERVICE_MODE: outbox-relay
      NEXUSIM_PG_DSN: postgres://nexusim:nexusim@host.docker.internal:5432/nexusim?sslmode=disable
      NEXUSIM_KAFKA_BROKERS: kafka:29092
    restart: unless-stopped
    networks:
      - nexusim-services
      - nexusim-local

  identity-service-outbox-relay:
    image: nexusim/identity-service:local
    container_name: nexusim-identity-service-outbox-relay
    environment:
      NEXUSIM_IDENTITY_SERVICE_MODE: outbox-relay
      NEXUSIM_PG_DSN: postgres://nexusim:nexusim@host.docker.internal:5432/nexusim?sslmode=disable
      NEXUSIM_KAFKA_BROKERS: kafka:29092
    restart: unless-stopped
    networks:
      - nexusim-services
      - nexusim-local

  search-service-timeline-consumer:
    image: nexusim/search-service:local
    container_name: nexusim-search-service-timeline-consumer
    environment:
      NEXUSIM_SEARCH_SERVICE_MODE: timeline-consumer
      NEXUSIM_PG_DSN: postgres://nexusim:nexusim@host.docker.internal:5432/nexusim?sslmode=disable
      NEXUSIM_KAFKA_BROKERS: kafka:29092
      NEXUSIM_SEARCH_CONSUMER_GROUP: nexusim-search-service-local
    restart: unless-stopped
    networks:
      - nexusim-services
      - nexusim-local

  memory-service-timeline-consumer:
    image: nexusim/memory-service:local
    container_name: nexusim-memory-service-timeline-consumer
    environment:
      NEXUSIM_MEMORY_SERVICE_MODE: timeline-consumer
      NEXUSIM_PG_DSN: postgres://nexusim:nexusim@host.docker.internal:5432/nexusim?sslmode=disable
      NEXUSIM_KAFKA_BROKERS: kafka:29092
      NEXUSIM_MEMORY_CONSUMER_GROUP: nexusim-memory-service-local
    restart: unless-stopped
    networks:
      - nexusim-services
      - nexusim-local

  agent-service-approval-outbox-relay:
    image: nexusim/agent-service:local
    container_name: nexusim-agent-service-approval-outbox-relay
    environment:
      NEXUSIM_AGENT_SERVICE_MODE: approval-outbox-relay
      NEXUSIM_PG_DSN: postgres://nexusim:nexusim@host.docker.internal:5432/nexusim?sslmode=disable
      NEXUSIM_KAFKA_BROKERS: kafka:29092
    restart: unless-stopped
    networks:
      - nexusim-services
      - nexusim-local

networks:
  nexusim-services:
    name: nexusim-services
  nexusim-local:
    external: true
    name: nexusim-local_default
