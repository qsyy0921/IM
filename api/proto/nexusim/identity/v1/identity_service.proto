syntax = "proto3";

package nexusim.identity.v1;

option go_package = "github.com/qsyy0921/IM/api/proto/nexusim/identity/v1;identityv1";

service IdentityService {
  rpc RegisterUser(RegisterUserRequest) returns (RegisterUserResponse);
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc RefreshGatewayToken(RefreshGatewayTokenRequest) returns (RefreshGatewayTokenResponse);
  rpc RequestVerificationChallenge(RequestVerificationChallengeRequest) returns (RequestVerificationChallengeResponse);
  rpc ConfirmVerificationChallenge(ConfirmVerificationChallengeRequest) returns (ConfirmVerificationChallengeResponse);
  rpc RequestPasswordReset(RequestPasswordResetRequest) returns (RequestPasswordResetResponse);
  rpc ConfirmPasswordReset(ConfirmPasswordResetRequest) returns (ConfirmPasswordResetResponse);
  rpc BeginMFAEnrollment(BeginMFAEnrollmentRequest) returns (BeginMFAEnrollmentResponse);
  rpc ConfirmMFAEnrollment(ConfirmMFAEnrollmentRequest) returns (ConfirmMFAEnrollmentResponse);
  rpc DisableMFAFactor(DisableMFAFactorRequest) returns (DisableMFAFactorResponse);
  rpc IssueGatewayToken(IssueGatewayTokenRequest) returns (IssueGatewayTokenResponse);
  rpc RevokeDevice(RevokeDeviceRequest) returns (RevokeDeviceResponse);
  rpc RevokeSession(RevokeSessionRequest) returns (RevokeSessionResponse);
  rpc GetDeviceState(GetDeviceStateRequest) returns (GetDeviceStateResponse);
}

message AdminContext {
  string tenant_id = 1;
  string operator_user_id = 2;
  string trace_id = 3;
  string request_id = 4;
}

message RegisterUserRequest {
  string tenant_id = 1;
  string user_id = 2;
  string password = 3;
  string trace_id = 4;
  string request_id = 5;
}

message RegisterUserResponse {
  string tenant_id = 1;
  string user_id = 2;
  UserStatus status = 3;
  int64 created_at_unix_ms = 4;
}

message LoginRequest {
  string tenant_id = 1;
  string user_id = 2;
  string password = 3;
  string device_id = 4;
  string audience = 5;
  int64 gateway_ttl_seconds = 6;
  int64 refresh_ttl_seconds = 7;
  string trace_id = 8;
  string request_id = 9;
}

message LoginResponse {
  string tenant_id = 1;
  string user_id = 2;
  string device_id = 3;
  string session_id = 4;
  string audience = 5;
  string token_type = 6;
  string gateway_token = 7;
  string refresh_token = 8;
  int64 gateway_expires_at_unix_ms = 9;
  int64 refresh_expires_at_unix_ms = 10;
  int64 issued_at_unix_ms = 11;
}

message RefreshGatewayTokenRequest {
  string tenant_id = 1;
  string user_id = 2;
  string device_id = 3;
  string refresh_token = 4;
  string audience = 5;
  int64 gateway_ttl_seconds = 6;
  int64 refresh_ttl_seconds = 7;
  string trace_id = 8;
  string request_id = 9;
}

message RefreshGatewayTokenResponse {
  string tenant_id = 1;
  string user_id = 2;
  string device_id = 3;
  string session_id = 4;
  string audience = 5;
  string token_type = 6;
  string gateway_token = 7;
  string refresh_token = 8;
  int64 gateway_expires_at_unix_ms = 9;
  int64 refresh_expires_at_unix_ms = 10;
  int64 issued_at_unix_ms = 11;
}

message RequestVerificationChallengeRequest {
  string tenant_id = 1;
  string user_id = 2;
  VerificationChannel channel = 3;
  string destination = 4;
  int64 ttl_seconds = 5;
  string trace_id = 6;
  string request_id = 7;
  string password = 8;
}

message RequestVerificationChallengeResponse {
  string tenant_id = 1;
  string user_id = 2;
  string challenge_id = 3;
  VerificationChannel channel = 4;
  string destination = 5;
  int64 expires_at_unix_ms = 6;
  string dev_challenge_token = 7;
}

message ConfirmVerificationChallengeRequest {
  string tenant_id = 1;
  string user_id = 2;
  string challenge_id = 3;
  string challenge_token = 4;
  string trace_id = 5;
  string request_id = 6;
}

message ConfirmVerificationChallengeResponse {
  string tenant_id = 1;
  string user_id = 2;
  VerificationChannel channel = 3;
  string destination = 4;
  int64 verified_at_unix_ms = 5;
}

message RequestPasswordResetRequest {
  string tenant_id = 1;
  string user_id = 2;
  VerificationChannel channel = 3;
  string destination = 4;
  int64 ttl_seconds = 5;
  string trace_id = 6;
  string request_id = 7;
}

message RequestPasswordResetResponse {
  string tenant_id = 1;
  string user_id = 2;
  string challenge_id = 3;
  VerificationChannel channel = 4;
  string destination = 5;
  int64 expires_at_unix_ms = 6;
  string dev_challenge_token = 7;
}

message ConfirmPasswordResetRequest {
  string tenant_id = 1;
  string user_id = 2;
  string challenge_id = 3;
  string challenge_token = 4;
  string new_password = 5;
  string trace_id = 6;
  string request_id = 7;
}

message ConfirmPasswordResetResponse {
  string tenant_id = 1;
  string user_id = 2;
  int64 reset_at_unix_ms = 3;
}

message BeginMFAEnrollmentRequest {
  string tenant_id = 1;
  string user_id = 2;
  MFAFactorType factor_type = 3;
  string password = 4;
  string display_name = 5;
  string issuer = 6;
  string trace_id = 7;
  string request_id = 8;
}

message BeginMFAEnrollmentResponse {
  string tenant_id = 1;
  string user_id = 2;
  string factor_id = 3;
  MFAFactorType factor_type = 4;
  MFAFactorStatus status = 5;
  string secret = 6;
  string otpauth_uri = 7;
  int64 created_at_unix_ms = 8;
}

message ConfirmMFAEnrollmentRequest {
  string tenant_id = 1;
  string user_id = 2;
  string factor_id = 3;
  string code = 4;
  string trace_id = 5;
  string request_id = 6;
}

message ConfirmMFAEnrollmentResponse {
  string tenant_id = 1;
  string user_id = 2;
  string factor_id = 3;
  MFAFactorStatus status = 4;
  int64 verified_at_unix_ms = 5;
}

message DisableMFAFactorRequest {
  string tenant_id = 1;
  string user_id = 2;
  string factor_id = 3;
  string password = 4;
  string trace_id = 5;
  string request_id = 6;
}

message DisableMFAFactorResponse {
  string tenant_id = 1;
  string user_id = 2;
  string factor_id = 3;
  MFAFactorStatus status = 4;
  int64 disabled_at_unix_ms = 5;
}

message IssueGatewayTokenRequest {
  string tenant_id = 1;
  string user_id = 2;
  string device_id = 3;
  string session_id = 4;
  string audience = 5;
  int64 ttl_seconds = 6;
  string trace_id = 7;
  string request_id = 8;
}

message IssueGatewayTokenResponse {
  string tenant_id = 1;
  string user_id = 2;
  string device_id = 3;
  string session_id = 4;
  string audience = 5;
  string gateway_token = 6;
  int64 expires_at_unix_ms = 7;
  int64 issued_at_unix_ms = 8;
}

message RevokeDeviceRequest {
  AdminContext admin_context = 1;
  string user_id = 2;
  string device_id = 3;
  string reason = 4;
}

message RevokeDeviceResponse {
  string tenant_id = 1;
  string user_id = 2;
  string device_id = 3;
  DeviceStatus status = 4;
  int64 revoked_at_unix_ms = 5;
}

message RevokeSessionRequest {
  AdminContext admin_context = 1;
  string user_id = 2;
  string device_id = 3;
  string session_id = 4;
  string reason = 5;
}

message RevokeSessionResponse {
  string tenant_id = 1;
  string user_id = 2;
  string device_id = 3;
  string session_id = 4;
  SessionStatus status = 5;
  int64 revoked_at_unix_ms = 6;
}

message GetDeviceStateRequest {
  AdminContext admin_context = 1;
  string user_id = 2;
  string device_id = 3;
}

message GetDeviceStateResponse {
  string tenant_id = 1;
  string user_id = 2;
  string device_id = 3;
  DeviceStatus status = 4;
  int64 created_at_unix_ms = 5;
  int64 updated_at_unix_ms = 6;
  int64 revoked_at_unix_ms = 7;
}

enum DeviceStatus {
  DEVICE_STATUS_UNSPECIFIED = 0;
  DEVICE_STATUS_ACTIVE = 1;
  DEVICE_STATUS_REVOKED = 2;
}

enum UserStatus {
  USER_STATUS_UNSPECIFIED = 0;
  USER_STATUS_ACTIVE = 1;
}

enum VerificationChannel {
  VERIFICATION_CHANNEL_UNSPECIFIED = 0;
  VERIFICATION_CHANNEL_EMAIL = 1;
  VERIFICATION_CHANNEL_PHONE = 2;
}

enum MFAFactorType {
  MFA_FACTOR_TYPE_UNSPECIFIED = 0;
  MFA_FACTOR_TYPE_TOTP = 1;
}

enum MFAFactorStatus {
  MFA_FACTOR_STATUS_UNSPECIFIED = 0;
  MFA_FACTOR_STATUS_PENDING = 1;
  MFA_FACTOR_STATUS_ACTIVE = 2;
  MFA_FACTOR_STATUS_DISABLED = 3;
}

enum SessionStatus {
  SESSION_STATUS_UNSPECIFIED = 0;
  SESSION_STATUS_ACTIVE = 1;
  SESSION_STATUS_REVOKED = 2;
}
