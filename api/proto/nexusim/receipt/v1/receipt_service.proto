syntax = "proto3";

package nexusim.receipt.v1;

option go_package = "github.com/qsyy0921/IM/api/proto/nexusim/receipt/v1;receiptv1";

service ReceiptService {
  rpc MarkRead(MarkReadRequest) returns (MarkReadResponse);
  rpc GetReceiptState(GetReceiptStateRequest) returns (GetReceiptStateResponse);
  rpc ListReceiptStates(ListReceiptStatesRequest) returns (ListReceiptStatesResponse);
  rpc ListConversations(ListConversationsRequest) returns (ListConversationsResponse);
  rpc ArchiveConversation(ArchiveConversationRequest) returns (ArchiveConversationResponse);
  rpc PinConversation(PinConversationRequest) returns (PinConversationResponse);
  rpc MuteConversation(MuteConversationRequest) returns (MuteConversationResponse);
  rpc SetConversationTags(SetConversationTagsRequest) returns (SetConversationTagsResponse);
  rpc SetConversationDraft(SetConversationDraftRequest) returns (SetConversationDraftResponse);
}

message AuthContext {
  string tenant_id = 1;
  string user_id = 2;
  string device_id = 3;
  string session_id = 4;
  string trace_id = 5;
  string request_id = 6;
}

message MarkReadRequest {
  AuthContext auth_context = 1;
  string conversation_id = 2;
  int64 read_seq = 3;
}

message MarkReadResponse {
  string tenant_id = 1;
  string user_id = 2;
  string conversation_id = 3;
  int64 last_read_seq = 4;
}

message GetReceiptStateRequest {
  AuthContext auth_context = 1;
  string conversation_id = 2;
  string message_id = 3;
  int64 conversation_seq = 4;
  bool include_received_devices = 5;
  int32 received_device_limit = 6;
}

message ReceiptUserState {
  string user_id = 1;
  int64 received_seq = 2;
  int64 received_at_unix_ms = 3;
  int64 read_seq = 4;
  int64 read_at_unix_ms = 5;
  int32 received_device_count = 6;
  repeated ReceivedDeviceState received_devices = 7;
  bool received_devices_truncated = 8;
}

message ReceivedDeviceState {
  string device_id = 1;
  int64 last_received_seq = 2;
  int64 updated_at_unix_ms = 3;
}

enum ReceiptVisibilityMode {
  RECEIPT_VISIBILITY_MODE_UNSPECIFIED = 0;
  RECEIPT_VISIBILITY_MODE_DETAILED = 1;
  RECEIPT_VISIBILITY_MODE_COUNT_ONLY = 2;
  RECEIPT_VISIBILITY_MODE_HIDDEN = 3;
}

message GetReceiptStateResponse {
  string conversation_id = 1;
  int64 conversation_seq = 2;
  string message_id = 3;
  int32 received_user_count = 4;
  int32 read_user_count = 5;
  ReceiptVisibilityMode visibility_mode = 6;
  repeated ReceiptUserState receivers = 7;
}

message ReceiptStateQuery {
  string message_id = 1;
  int64 conversation_seq = 2;
}

message ListReceiptStatesRequest {
  AuthContext auth_context = 1;
  string conversation_id = 2;
  repeated ReceiptStateQuery items = 3;
  bool include_received_devices = 4;
  int32 received_device_limit = 5;
}

message ListReceiptStatesResponse {
  repeated GetReceiptStateResponse items = 1;
}

enum ConversationListSort {
  CONVERSATION_LIST_SORT_UNSPECIFIED = 0;
  CONVERSATION_LIST_SORT_UPDATED_AT_DESC = 1;
  CONVERSATION_LIST_SORT_PINNED_UPDATED_AT_DESC = 2;
  CONVERSATION_LIST_SORT_UNREAD_UPDATED_AT_DESC = 3;
  CONVERSATION_LIST_SORT_DRAFT_UPDATED_AT_DESC = 4;
}

message ListConversationsRequest {
  AuthContext auth_context = 1;
  int32 limit = 2;
  string page_cursor = 3;
  ConversationListSort sort = 4;
  bool include_archived = 5;
  bool unread_only = 6;
  bool pinned_only = 7;
  bool muted_only = 8;
  string tag_filter = 9;
  bool draft_only = 10;
  bool archived_only = 11;
  repeated string tag_filters = 12;
  string last_source_event_type_filter = 13;
}

message ProjectionWatermark {
  string source = 1;
  int64 offset_value = 2;
  int64 updated_at_unix_ms = 3;
}

message ConversationSummary {
  string conversation_id = 1;
  int64 last_visible_seq = 2;
  string last_message_id = 3;
  string last_sender_id = 4;
  int64 unread_count = 5;
  int64 last_read_seq = 6;
  int64 updated_at_unix_ms = 7;
  string last_source_event_type = 8;
  bool archived = 9;
  bool pinned = 10;
  bool muted = 11;
  repeated string tags = 12;
  string draft_text = 13;
  int64 draft_updated_at_unix_ms = 14;
}

message ListConversationsResponse {
  repeated ConversationSummary items = 1;
  string next_page_cursor = 2;
  ProjectionWatermark projection_watermark = 3;
}

message ArchiveConversationRequest {
  AuthContext auth_context = 1;
  string conversation_id = 2;
  bool archived = 3;
}

message ArchiveConversationResponse {
  ConversationSummary conversation = 1;
}

message PinConversationRequest {
  AuthContext auth_context = 1;
  string conversation_id = 2;
  bool pinned = 3;
}

message PinConversationResponse {
  ConversationSummary conversation = 1;
}

message MuteConversationRequest {
  AuthContext auth_context = 1;
  string conversation_id = 2;
  bool muted = 3;
}

message MuteConversationResponse {
  ConversationSummary conversation = 1;
}

message SetConversationTagsRequest {
  AuthContext auth_context = 1;
  string conversation_id = 2;
  repeated string tags = 3;
}

message SetConversationTagsResponse {
  ConversationSummary conversation = 1;
}

message SetConversationDraftRequest {
  AuthContext auth_context = 1;
  string conversation_id = 2;
  string draft_text = 3;
}

message SetConversationDraftResponse {
  ConversationSummary conversation = 1;
}
