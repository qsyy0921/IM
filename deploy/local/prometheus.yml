global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: nexusim-api-gateway
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:11904
        labels:
          service: api-gateway

  - job_name: nexusim-identity-service
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:11905
        labels:
          service: identity-service
