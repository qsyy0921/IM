syntax = "proto3";

package nexusim.vector.v1;

option go_package = "github.com/qsyy0921/IM/api/proto/nexusim/vector/v1;vectorv1";

service VectorIndexService {
  rpc UpsertVectorItem(UpsertVectorItemRequest) returns (UpsertVectorItemResponse);
  rpc TombstoneVectorItem(TombstoneVectorItemRequest) returns (TombstoneVectorItemResponse);
  rpc SearchVectors(SearchVectorsRequest) returns (SearchVectorsResponse);
  rpc GetVectorIndexJob(GetVectorIndexJobRequest) returns (GetVectorIndexJobResponse);
}

message AuthContext {
  string tenant_id = 1;
  string user_id = 2;
  string service_name = 3;
  string instance_ref = 4;
  string trace_id = 5;
  string request_id = 6;
}

message VectorItem {
  string tenant_id = 1;
  string vector_item_id = 2;
  string collection_id = 3;
  string collection_type = 4;
  string source_service = 5;
  string source_ref_hash = 6;
  string source_id = 7;
  int64 source_version = 8;
  string source_hash = 9;
  string chunk_hash = 10;
  string embedding_model_ref = 11;
  string embedding_vector_hash = 12;
  int32 dimension = 13;
  string visibility_scope = 14;
  int64 visibility_version = 15;
  string policy_version = 16;
  string data_class = 17;
  string tombstone_status = 18;
  string delete_proof_id = 19;
  string retention_policy_ref = 20;
  string status = 21;
  int64 created_at_unix_ms = 22;
  int64 updated_at_unix_ms = 23;
}

message VectorIndexJob {
  string tenant_id = 1;
  string job_id = 2;
  string collection_id = 3;
  string vector_item_id = 4;
  string job_type = 5;
  string status = 6;
  int32 retry_count = 7;
  string failure_class = 8;
  string public_error = 9;
  int64 created_at_unix_ms = 10;
  int64 completed_at_unix_ms = 11;
}

message VectorSearchResult {
  string vector_item_ref = 1;
  string source_ref_hash = 2;
  string source_service = 3;
  string collection_type = 4;
  double score = 5;
  int64 visibility_version = 6;
  string tombstone_status = 7;
}

message UpsertVectorItemRequest {
  AuthContext auth_context = 1;
  string source_service = 2;
  string collection_type = 3;
  string source_ref_hash = 4;
  string source_id = 5;
  int64 source_version = 6;
  string source_hash = 7;
  string chunk_hash = 8;
  string embedding_model_ref = 9;
  string embedding_vector_hash = 10;
  int32 dimension = 11;
  string visibility_scope = 12;
  int64 visibility_version = 13;
  string policy_version = 14;
  string data_class = 15;
  string delete_proof_id = 16;
  string retention_policy_ref = 17;
  string idempotency_key = 18;
  string correlation_id = 19;
  string causation_id = 20;
  string trace_id = 21;
}

message UpsertVectorItemResponse {
  VectorItem item = 1;
  VectorIndexJob job = 2;
  bool replayed = 3;
}

message TombstoneVectorItemRequest {
  AuthContext auth_context = 1;
  string vector_item_id = 2;
  string delete_proof_id = 3;
  string reason_class = 4;
  string idempotency_key = 5;
  string correlation_id = 6;
  string causation_id = 7;
  string trace_id = 8;
}

message TombstoneVectorItemResponse {
  VectorItem item = 1;
  VectorIndexJob job = 2;
  string tombstone_id = 3;
  bool replayed = 4;
}

message SearchVectorsRequest {
  AuthContext auth_context = 1;
  string requester_ref = 2;
  string retrieval_request_id = 3;
  repeated string collection_types = 4;
  string query_embedding_ref = 5;
  int32 top_k = 6;
  double min_score = 7;
  string visibility_scope = 8;
  string policy_version = 9;
  int64 at_unix_ms = 10;
}

message SearchVectorsResponse {
  repeated VectorSearchResult results = 1;
}

message GetVectorIndexJobRequest {
  AuthContext auth_context = 1;
  string job_id = 2;
}

message GetVectorIndexJobResponse {
  VectorIndexJob job = 1;
}
