syntax = "proto3";

package nexusim.delivery.v1;

option go_package = "github.com/qsyy0921/IM/api/proto/nexusim/delivery/v1;deliveryv1";

service DeliveryService {
  rpc PullInbox(PullInboxRequest) returns (PullInboxResponse);
  rpc AckDelivery(AckDeliveryRequest) returns (AckDeliveryResponse);
  rpc HideInboxItem(HideInboxItemRequest) returns (HideInboxItemResponse);
}

message AuthContext {
  string tenant_id = 1;
  string user_id = 2;
  string device_id = 3;
  string session_id = 4;
  string trace_id = 5;
  string request_id = 6;
}

message PullInboxRequest {
  AuthContext auth_context = 1;
  string conversation_id = 2;
  int64 after_seq = 3;
  int32 limit = 4;
}

message InboxItem {
  string conversation_id = 1;
  int64 conversation_seq = 2;
  string event_id = 3;
  string event_type = 4;
  string message_id = 5;
  string sender_id = 6;
  bytes payload_json = 7;
  int64 created_at_unix_ms = 8;
}

message PullInboxResponse {
  repeated InboxItem items = 1;
  int64 next_seq = 2;
  bool has_more = 3;
}

message AckDeliveryRequest {
  AuthContext auth_context = 1;
  string conversation_id = 2;
  int64 received_seq = 3;
}

message AckDeliveryResponse {
  string tenant_id = 1;
  string user_id = 2;
  string device_id = 3;
  string conversation_id = 4;
  int64 last_received_seq = 5;
}

message HideInboxItemRequest {
  AuthContext auth_context = 1;
  string conversation_id = 2;
  int64 conversation_seq = 3;
  string reason = 4;
}

message HideInboxItemResponse {
  string tenant_id = 1;
  string user_id = 2;
  string conversation_id = 3;
  int64 conversation_seq = 4;
  bool already_hidden = 5;
}
