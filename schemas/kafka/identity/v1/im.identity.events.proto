syntax = "proto3";

package nexusim.identity.events.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/qsyy0921/IM/schemas/kafka/identity/v1;identityeventsv1";

// Topic: im.identity.events
// Partition key: tenant_id + ":" + user_id + ":" + device_id.
// Producer: identity-service outbox relay.
message IdentityEvent {
  string event_id = 1;
  string event_type = 2;
  string event_version = 3;

  string tenant_id = 4;
  string aggregate_type = 5;
  string aggregate_id = 6;
  int64 aggregate_version = 7;

  string partition_key = 8;
  int64 mapping_version = 9;
  string trace_id = 10;
  string correlation_id = 11;
  string causation_id = 12;
  string producer = 13;
  google.protobuf.Timestamp occurred_at = 14;

  oneof payload {
    IdentityDeviceRevokedV1 device_revoked = 20;
    IdentitySessionRevokedV1 session_revoked = 21;
  }
}

message IdentityDeviceRevokedV1 {
  string tenant_id = 1;
  string user_id = 2;
  string device_id = 3;
  string status = 4;
  string revoked_by = 5;
  string reason = 6;
  google.protobuf.Timestamp revoked_at = 7;
}

message IdentitySessionRevokedV1 {
  string tenant_id = 1;
  string user_id = 2;
  string device_id = 3;
  string session_id = 4;
  string status = 5;
  string revoked_by = 6;
  string reason = 7;
  google.protobuf.Timestamp revoked_at = 8;
}
