syntax = "proto3";

package nexusim.retrieval.v1;

option go_package = "github.com/qsyy0921/IM/api/proto/nexusim/retrieval/v1;retrievalv1";

service RetrievalGateway {
  rpc RetrieveEvidence(RetrieveEvidenceRequest) returns (RetrieveEvidenceResponse);
}

message AuthContext {
  string tenant_id = 1;
  string user_id = 2;
  string device_id = 3;
  string session_id = 4;
  string trace_id = 5;
  string request_id = 6;
}

enum EvidenceSourceType {
  EVIDENCE_SOURCE_TYPE_UNSPECIFIED = 0;
  EVIDENCE_SOURCE_TYPE_SEARCH_MESSAGE = 1;
  EVIDENCE_SOURCE_TYPE_MEMORY_EVENT = 2;
  EVIDENCE_SOURCE_TYPE_PROFILE_AGGREGATE = 3;
  EVIDENCE_SOURCE_TYPE_VECTOR_ITEM = 4;
}

enum EvidenceMemoryStatus {
  EVIDENCE_MEMORY_STATUS_UNSPECIFIED = 0;
  EVIDENCE_MEMORY_STATUS_PENDING = 1;
  EVIDENCE_MEMORY_STATUS_ACTIVE = 2;
  EVIDENCE_MEMORY_STATUS_SUPERSEDED = 3;
  EVIDENCE_MEMORY_STATUS_ARCHIVED = 4;
}

enum EvidenceSourceCoverageStatus {
  EVIDENCE_SOURCE_COVERAGE_STATUS_UNSPECIFIED = 0;
  EVIDENCE_SOURCE_COVERAGE_STATUS_NOT_REQUESTED = 1;
  EVIDENCE_SOURCE_COVERAGE_STATUS_EMPTY = 2;
  EVIDENCE_SOURCE_COVERAGE_STATUS_RETURNED = 3;
  EVIDENCE_SOURCE_COVERAGE_STATUS_FILTERED = 4;
}

message RetrieveEvidenceRequest {
  AuthContext auth_context = 1;
  string query = 2;
  string conversation_id = 3;
  int64 after_seq = 4;
  int32 limit = 5;
  bool include_search = 6;
  bool include_memory = 7;
  repeated EvidenceMemoryStatus memory_statuses = 8;
  int64 at_conversation_seq = 9;
  bool include_vector = 10;
  string query_embedding_ref = 11;
  repeated string vector_collection_types = 12;
  string vector_visibility_scope = 13;
  string vector_policy_version = 14;
  double vector_min_score = 15;
}

message EvidenceSourceRef {
  string source_type = 1;
  string source_id = 2;
  string source_event_id = 3;
  string conversation_id = 4;
  int64 conversation_seq = 5;
  int64 occurred_at_unix_ms = 6;
}

message EvidenceMemoryGraphEdge {
  string edge_id = 1;
  string from_memory_event_id = 2;
  string to_memory_event_id = 3;
  string relation_type = 4;
  double confidence = 5;
  repeated EvidenceSourceRef source_refs = 6;
}

message EvidenceItem {
  string evidence_id = 1;
  EvidenceSourceType source_type = 2;
  string source_id = 3;
  string conversation_id = 4;
  int64 conversation_seq = 5;
  string text = 6;
  double score = 7;
  string speaker_user_id = 8;
  string message_id = 9;
  string memory_event_id = 10;
  int64 occurred_at_unix_ms = 11;
  int64 valid_from_seq = 12;
  int64 valid_to_seq = 13;
  int64 visibility_version = 14;
  repeated EvidenceSourceRef source_refs = 15;
  repeated string actor_user_ids = 16;
  repeated string audience_user_ids = 17;
  string temporal_status = 18;
  string review_state = 19;
  string extraction_version = 20;
  double rerank_score = 21;
  string dedupe_reason = 22;
  repeated EvidenceMemoryGraphEdge memory_graph_edges = 23;
  string profile_id = 24;
  string profile_subject_user_id = 25;
  string profile_aggregate_type = 26;
  string profile_aggregate_key = 27;
  repeated string supporting_memory_event_ids = 28;
  int64 profile_valid_from_unix_ms = 29;
  int64 profile_valid_to_unix_ms = 30;
  int64 profile_updated_at_unix_ms = 31;
  string vector_item_ref = 32;
  string vector_source_ref_hash = 33;
  string vector_source_service = 34;
  string vector_collection_type = 35;
  string vector_tombstone_status = 36;
}

message EvidenceSourceCount {
  EvidenceSourceType source_type = 1;
  int32 count = 2;
}

message EvidenceSourceCoverage {
  EvidenceSourceType source_type = 1;
  bool requested = 2;
  int32 candidate_count = 3;
  int32 returned_count = 4;
  int32 deduped_count = 5;
  EvidenceSourceCoverageStatus status = 6;
}

message EvidencePack {
  string pack_id = 1;
  string tenant_id = 2;
  string query = 3;
  string conversation_id = 4;
  repeated EvidenceItem items = 5;
  repeated EvidenceSourceCount source_counts = 6;
  int64 search_projection_version = 7;
  int64 memory_projection_version = 8;
  string retrieval_version = 9;
  repeated EvidenceSourceCoverage source_coverage = 10;
}

message RetrieveEvidenceResponse {
  EvidencePack pack = 1;
}
